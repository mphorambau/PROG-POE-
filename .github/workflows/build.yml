name: Windows .NET Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Restore and build WinForms application
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: CyberSecurityAwarenessChatbot/CyberSecurityAwarenessChatbot.csproj
      - name: Restore NuGet packages
        run: dotnet restore CyberSecurityAwarenessChatbot/CyberSecurityAwarenessChatbot.csproj
      - name: Build Release
        run: dotnet build CyberSecurityAwarenessChatbot/CyberSecurityAwarenessChatbot.csproj --configuration Release --no-restore
